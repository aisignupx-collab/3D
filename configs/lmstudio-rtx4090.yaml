# RTX 4090 (24 GB) with LM Studio serving both AI models locally. Use with:
#   python webui.py --config configs/lmstudio-rtx4090.yaml      (or main.py --config ...)
# In LM Studio: Developer tab -> Start server (port 1234) and enable "Just-in-time model loading".
# Model names must match LM Studio's identifiers - the web UI's "Find models" button lists them.

llm:
  provider: lmstudio
  model: qwen2.5-14b-instruct      # any text model; 7-14B Q4 is plenty for planning
  base_url: http://localhost:1234/v1
vision:
  provider: lmstudio
  model: qwen2.5-vl-7b-instruct    # must be a VLM (LM Studio marks it "vision"); keep <= 8B on 24 GB
  base_url: http://localhost:1234/v1
diffusion:
  backend: diffusers
  model_id: stabilityai/stable-diffusion-xl-base-1.0
  steps: 30
  guidance_scale: 6.0
  width: 1024
  height: 1024
  enable_cpu_offload: false        # 24 GB holds SDXL comfortably
  # FLUX.1-schnell alternative (sharper, needs ~24 GB bf16 or offload):
  # model_id: black-forest-labs/FLUX.1-schnell
  # pipeline_type: flux
  # steps: 4
  # guidance_scale: 0.0

preprocess:
  projection_size: 2048

reconstruction:
  backend: triposr
  device: cuda:0
  mc_resolution: 320               # more detail than the 256 default; ~8 GB
  chunk_size: 16384

blender:
  use_gpu: true                    # Cycles OptiX for bakes and audit renders

cleanup:
  voxel_resolution: 256

texture:
  resolution: 4096
  bake_samples: 32

render:
  resolution: 1024
  engine: cycles
  samples: 64

pipeline:
  max_iterations: 3
  unload_models_between_stages: true
