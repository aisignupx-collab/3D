# Copy to config.yaml and edit. Every key is optional; defaults live in
# asset_pipeline/config.py. Env overrides: ASSET_PIPELINE_<SECTION>__<KEY>=value

llm:                         # Stage 1 concept planner (text)
  # ollama | openai_compatible | lmstudio | vllm | openai | anthropic | deepseek | gemini | openrouter | cli
  provider: ollama
  model: qwen2.5:14b-instruct
  base_url: http://localhost:11434   # vLLM: http://localhost:8000  LM Studio: http://localhost:1234
  api_key_env: ""            # override the provider's default key variable (keys never go in this file)
  temperature: 0.2
  command: ""                # provider cli: "claude -p {prompt}" | "codex exec {prompt}" | "opencode run {prompt}"

vision:                      # Stage 6 auditor (must accept images)
  provider: ollama
  model: qwen2.5vl:7b        # alternatives: llava:13b, minicpm-v, or cloud claude-sonnet-5-5 / gpt-4o
  base_url: http://localhost:11434

diffusion:                   # Stage 1 reference images
  backend: diffusers         # diffusers | comfyui
  model_id: stabilityai/stable-diffusion-xl-base-1.0   # or black-forest-labs/FLUX.1-schnell
  pipeline_type: auto        # auto | sdxl | flux | sd
  steps: 30
  guidance_scale: 6.0
  width: 1024
  height: 1024
  enable_cpu_offload: false  # true on <12 GB cards
  comfyui_url: http://127.0.0.1:8188
  comfyui_workflow: ""       # API-format JSON with {{prompt}} {{negative}} {{seed}} {{width}} {{height}}
  comfyui_checkpoint: sd_xl_base_1.0.safetensors
  views: [isometric, front, side]

preprocess:
  rembg_model: isnet-general-use
  foreground_ratio: 0.85
  output_size: 512
  projection_size: 2048      # high-res copy of the reconstruction input, projected back as texture

reconstruction:              # Stage 2
  backend: triposr           # triposr | instantmesh | openlrm | command | primitive
  device: cuda:0
  triposr_repo: third_party/TripoSR
  mc_resolution: 256         # marching-cubes grid; 320-384 for more detail (more VRAM)
  instantmesh_repo: third_party/InstantMesh
  instantmesh_python: third_party/InstantMesh/.venv/bin/python
  instantmesh_config: configs/instant-mesh-large.yaml
  openlrm_repo: third_party/OpenLRM
  openlrm_python: third_party/OpenLRM/.venv/bin/python
  # command backend example (TRELLIS / Hunyuan3D / SF3D CLI); placeholders: {python} {input} {input_rgba} {output_dir}
  command_template: ""

blender:
  executable: ""             # auto-detect; or e.g. /opt/blender-4.2/blender, C:\Program Files\Blender Foundation\Blender 4.2\blender.exe
  use_gpu: true              # Cycles baking/rendering on OptiX/CUDA/HIP
  timeout_s: 3600
  cleanup_timeout_s: 600       # Stage 3 limit; on timeout it is retried with voxel remeshing

cleanup:                     # Stage 3 (the audit loop adjusts these)
  remesh_mode: quadriflow    # quadriflow | voxel | voxel_shrinkwrap | decimate | none
  voxel_resolution: 192
  target_faces: 0            # 0 = planner's per-asset budget
  smooth_iterations: 1
  auto_smooth_angle: 40.0
  min_island_ratio: 0.02
  auto_orient: true          # undo camera-frame yaw/tilt (min-volume box search)
  max_tilt_correction: 45.0
  orient_longest_axis: true  # longest horizontal extent -> X
  symmetrize_characters: true  # mirror characters/creatures across X before remeshing
  import_rotation_deg: [0.0, 0.0, 0.0]

shapes:                      # Stage 3b primitive templates
  mode: auto                 # auto (use when they fit the scan) | primitives (always) | mesh (never)
  recipe_max_error: 0.12     # max surface error (fraction of bbox diagonal) for a recipe
  classify_max_error: 0.035  # stricter limit for single-shape guesses (box/cylinder/...)
  union: true                # boolean-union components into one watertight shell
  refine: true               # snap component extents to the scan
  bake_normal: false         # bake the scan's (lumpy) normals onto the clean shapes
  blueprint: true            # guns/tools/machinery: three-view silhouette hull
  blueprint_max_error: 0.05
  blueprint_resolution: 256
  skyline_max_error: 0.1     # castles/cathedrals/...: towers, walls and roofs read from the scan's roofline
  skyline_grid: 64
  battlements: true          # merlons on flat tower tops and wall tops

texture:                     # Stage 4
  resolution: 2048           # 1024 | 2048 | 4096
  uv_method: smart           # smart | seams | lightmap
  albedo_source: bake        # bake (from reconstruction colours) | projection (reference views) | procedural
  project_reference: true    # re-project the reconstruction's input image onto visible texels
  min_projection_iou: 0.7
  mirror_fill: true          # fill unseen faces from the mirrored view (per-category symmetry)
  unseen_fill: tiles         # templates: tiles (per-material texture from the reference / procedural) | bake
  cage_extrusion: 0.01
  bake_samples: 16

render:                      # Stage 6 audit renders
  resolution: 1024
  engine: auto               # auto/cycles (works headless everywhere) | eevee | workbench
  samples: 32
  include_uv_checker: true

pipeline:
  output_dir: output
  max_iterations: 3
  approval_score: 0.75
  unload_models_between_stages: true
  seed: 42
